services:
  mysql:
    image: mysql:8.0
    container_name: mysql-prestashop
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: prestashop
      MYSQL_AUTHENTICATION_PLUGIN: mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

  prestashop:
    image: prestashop/prestashop:1.7.8.11
    container_name: prestashop
    platform: linux/amd64
    depends_on:
      - mysql
    environment:
      DB_SERVER: mysql
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWD: prestashop
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: localhost:8080
      PS_FOLDER_ADMIN: admin
      ADMIN_MAIL: admin@test.com
      ADMIN_PASSWD: Admin1234!
    ports:
      - "8080:80"
    volumes:
      - ./modules/productbadges:/var/www/html/modules/productbadges

volumes:
  mysql_data: